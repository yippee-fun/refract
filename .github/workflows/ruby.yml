name: CI
on:
  push:
    # Every branch, so a branch pushed to a fork gets its own run instead of
    # waiting on a maintainer to approve the workflow of a fork pull request.
    # "**" rather than "*" because the latter does not match a slash.
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"
          - "head"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false

      - name: Install dependencies
        run: |
          # `--without` was removed from Bundler; it relied on being remembered
          # across invocations, which Bundler no longer does. The flag makes the
          # Ruby head job fail before a single gem is installed.
          bundle config set --local without development
          bundle install --jobs 4

      - name: Quickdraw Tests
        run: bundle exec qt

  rubocop:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle install --jobs 4

      - name: Rubocop
        run: bundle exec rubocop
